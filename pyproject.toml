[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-causal"
version = "0.3.9"
description = "Orthogonal, risk-bounded intervention targeting with causal calibration and guarded policies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jinwoo Bae"}]
dependencies = [
  "numpy>=1.26,<2.4",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<1.10",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2"
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1"]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6,<7",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1"
]

[project.scripts]
orbit-causal = "orbit_causal.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: full pipeline smoke test"]
